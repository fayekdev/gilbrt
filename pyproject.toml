[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "gilbrt"
version = "0.2.0"
description = "Authorized website and AI application security auditing"
requires-python = ">=3.10"
dependencies = ["requests>=2.32,<3", "beautifulsoup4>=4.12,<5", "rich>=13,<15", "prompt-toolkit>=3.0.48,<4", "tree-sitter>=0.25,<0.26", "tree-sitter-javascript>=0.25,<0.26"]

[project.scripts]
gilbrt = "gilbrt.cli:main"

[tool.setuptools.packages.find]
include = ["gilbrt*"]

[tool.setuptools.package-data]
gilbrt = ["gui_assets/*.html", "gui_assets/*.css", "gui_assets/*.js", "gui_assets/*.svg"]
